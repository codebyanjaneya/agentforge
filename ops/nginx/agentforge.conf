# AgentForge reverse proxy: PRODUCTION EXAMPLE (nginx >= 1.25). Place in /etc/nginx/conf.d/. EXERCISED against a live nginx by ops/edge_drill.sh (limits, 413, 429, hidden endpoints, header overwrite, WebSocket
# upgrade, TLS floor, HTTP->HTTPS); NEVER run in front of a real deployment by this repository: hostnames, certificates, upstream addresses and every number below are PLACEHOLDERS to tune.
#
# What this layer is for, and what it is not:
#   * It is the FIRST line against UNAUTHENTICATED floods and oversized/slow requests, limited by client IP. The application limits AUTHENTICATED users (D070) and cannot count anyone before they
#     authenticate. Keep both: per-IP here, per-user there. Users behind one NAT share an IP: the per-IP numbers are deliberately generous.
#   * TLS terminates here. The upstreams are plain HTTP on a PRIVATE network only (never expose 8000/3000). HSTS only after you are sure HTTPS works for every host name.
#   * Forwarded headers: this proxy OVERWRITES X-Forwarded-For with the address it actually saw (a client-supplied value is discarded). If another trusted proxy/CDN sits in front, use the real_ip module
#     (set_real_ip_from <CDN ranges>; real_ip_header X-Forwarded-For;) so $remote_addr is the true client, and run the API with `uvicorn --proxy-headers --forwarded-allow-ips <this proxy's address>`.
#   * Internal endpoints (/metrics, /docs, /redoc, /openapi.json) are answered 404 here; scrape /metrics from inside the private network directly from the API process (METRICS_TOKEN protects it too).
#   * /ready is only for the load balancer / private ranges. /health is harmless (no dependencies) and is allowed.

limit_req_zone  $binary_remote_addr zone=af_auth:10m rate=20r/m;    # sign-in and /api/backend-token (token issuance): a person needs a few per hour
limit_req_zone  $binary_remote_addr zone=af_api:10m  rate=300r/m;   # the API and the web app, per IP
limit_req_zone  $binary_remote_addr zone=af_ws:10m   rate=30r/m;    # WebSocket handshakes
limit_conn_zone $binary_remote_addr zone=af_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream af_api { server af-edge-api:8000; keepalive 32; }   # the FastAPI process(es), PRIVATE network
upstream af_web { server af-edge-web:3000; keepalive 32; }   # the Next.js process(es), PRIVATE network

server {  # plain HTTP: redirect everything to HTTPS (add a /.well-known/acme-challenge/ location here if you use ACME HTTP-01)
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- shared by both HTTPS hosts (include-style; repeated here to keep the example one file) -------------------------------------------------------------------------------------------------------
# TLS: TLS 1.2+ only, modern ciphers from the nginx defaults, session tickets off (forward secrecy), OCSP stapling if your CA supports it.

server {  # the API host
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;          # the application refuses above MAX_REQUEST_BYTES too (default 1 MiB)
    client_header_timeout 10s;
    client_body_timeout   15s;        # slow-body (slowloris) protection
    send_timeout          30s;
    keepalive_timeout     30s;
    large_client_header_buffers 4 8k;
    limit_conn af_conn 40;            # simultaneous connections per IP

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, never append: a client-supplied value is discarded
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    130s;       # a plan or agent request waits on a model (the application's own limits apply inside)
    proxy_send_timeout    30s;

    error_page 429 = @too_many;
    location @too_many { default_type application/json; add_header Retry-After 5 always; return 429 '{"detail":{"code":"too_many_requests","message":"Too many requests. Please wait a moment and try again."}}'; }

    location = /metrics      { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }

    location = /health { access_log off; proxy_pass http://af_api; }
    location = /ready  { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1; deny all; proxy_pass http://af_api; }

    location = /ws {                  # WebSocket: per-IP handshake limit, small frames (the application also limits each message to 64 KiB and per user)
        limit_req zone=af_ws burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://af_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;     # an idle socket may live an hour; the application authenticates in the first 5 s
    }

    location /voice/ {                # Twilio webhooks are unauthenticated by design: restrict by source if your provider publishes ranges (allow ...; deny all;)
        limit_req zone=af_auth burst=20 nodelay;
        proxy_pass http://af_api;
    }

    location / {                      # everything else: the authenticated API
        limit_req zone=af_api burst=60 nodelay;
        proxy_pass http://af_api;
    }
}

server {  # the web (Next.js) host
    listen 443 ssl;
    http2 on;
    server_name app.example.com;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    large_client_header_buffers 4 8k;
    limit_conn af_conn 40;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    error_page 429 = @too_many;
    location @too_many { default_type application/json; add_header Retry-After 5 always; return 429 '{"error":"too_many_requests"}'; }

    location ~ ^/api/(backend-token|auth/) {   # token issuance and sign-in: the strictest per-IP limit (the app adds a per-person ceiling)
        limit_req zone=af_auth burst=10 nodelay;
        proxy_pass http://af_web;
    }

    location / {
        limit_req zone=af_api burst=60 nodelay;
        proxy_pass http://af_web;
    }
}
