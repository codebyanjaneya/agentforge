# Release gate. STATUS: executed by GitHub Actions; run 44895273806 (commit a671d0c) passed all four jobs. Earlier runs failed for real portability reasons that were fixed (unpinned SQLAlchemy 2.1 default driver, a Windows-only taskkill in the load harness, a Sentinel-drill setup race, curl negotiating HTTP/2 in the edge drill).
# No job needs a repository secret: tests use fakes, throw-away databases and loopback services; the only credentials here (`ci`, `ci-token`) are throw-away values for containers that exist for the job.
# Backend tests run ONE PROCESS PER FILE (the suite's module-purging fixtures need isolated files; see flow.md 25.27).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend tests, one process per file (PostgreSQL and Redis tests are skipped here; they run in the next job)
        run: |
          set -e
          for f in tests/test_*.py; do
            case $f in *test_postgres_integration*) continue;; esac
            python -m pytest "$f" -q -p no:cacheprovider
          done

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Disposable Redis and PostgreSQL (loopback, non-default ports, disposable-server token)
        working-directory: .
        run: |
          docker run -d --name redis -p 127.0.0.1:56379:6379 redis:7-alpine
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 127.0.0.1:54329:5432 postgres:16 -c agentforge.disposable=ci-token -c max_connections=200
          for _ in $(seq 40); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker exec redis redis-cli ping
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations - upgrade, downgrade one, upgrade again, on an empty database
        env:
          APP_ENV: development
          GROQ_API_KEY: ci-not-a-credential
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:54329/af_ci_migrations
        run: |
          docker exec pg psql -U postgres -c "CREATE DATABASE af_ci_migrations"
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -c "from migrations.schema_guard import verify_schema_version as v; print('head', v('$DATABASE_URL'))"
      - name: PostgreSQL integration (the full file, plus the invitation behaviour tests)
        env:
          AGENTFORGE_TEST_PG_ADMIN_URL: postgresql://postgres:ci@127.0.0.1:54329/postgres
          AGENTFORGE_TEST_PG_TOKEN: ci-token
        run: |
          python -m pytest tests/test_postgres_integration.py -q -p no:cacheprovider
          python -m pytest tests/test_invitations_postgres.py -q -p no:cacheprovider
      - name: Provider coordination across real processes (real Redis)
        env:
          AGENTFORGE_TEST_REDIS_URL: redis://127.0.0.1:56379/0
        run: python -m pytest tests/test_provider_coordination.py -q -p no:cacheprovider
      - name: Redis failure drill (stops and restarts the disposable Redis container)
        run: python tests/ops/redis_failure_drill.py redis redis://127.0.0.1:56379/0
      - name: Authenticated load smoke (2 API processes + 2 independent workers, PostgreSQL, Redis, stub provider, real email tool against a LOCAL mock; bounded)
        run: >
          python tests/ops/load_test.py --pg postgresql://postgres:ci@127.0.0.1:54329/postgres --redis redis://127.0.0.1:56379/0
          --vus 4 --seconds 25 --processes 2 --workers 2 --side-effects --out load-smoke.json
      - name: Fail the job if the smoke run had errors, broke the provider cap, the shared rate-limit budget or sent a duplicate
        run: >
          python -c "import json; d=json.load(open('load-smoke.json'));
          assert d['workload']['error_count']==0, d['workload']['errors'];
          assert d['provider_global_cap_respected'] and d['rate_limit_probe']['shared_budget_respected'];
          assert d['side_effect_audit']['no_duplicate_real_sends'] and d['db_audit']['runs_still_running']==0; print('load smoke ok')"
      - name: Worker crash under load (a worker is hard-killed while it owns a run; no duplicate side effect, nothing left running)
        run: >
          python tests/ops/load_test.py --pg postgresql://postgres:ci@127.0.0.1:54329/postgres --redis redis://127.0.0.1:56379/0
          --vus 6 --seconds 40 --processes 2 --workers 2 --side-effects --kill-worker-at 12 --worker-restart-after 6 --out load-crash.json &&
          python -c "import json; d=json.load(open('load-crash.json')); assert d['side_effect_audit']['no_duplicate_real_sends'] and d['db_audit']['runs_still_running']==0 and d['db_audit']['executions_still_running']==0; print('crash ok')"
      - name: Backup job and failed-restore drill (disposable PostgreSQL with WAL archiving)
        run: python ../ops/backup_drill.py
      - name: Point-in-time-recovery drill (Docker)
        working-directory: .
        run: bash ops/pitr_drill.sh
      - name: Redis Sentinel failover drill (degrade and closed modes)
        working-directory: .
        run: |
          bash ops/sentinel_failover_drill.sh degrade
          bash ops/sentinel_failover_drill.sh closed
      - name: "Reverse-proxy drill (real nginx: limits, 413, hidden endpoints, header overwrite, WebSocket, TLS floor)"
        working-directory: .
        run: bash ops/edge_drill.sh

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Staging template, alert rules and configuration gate
        run: python -m pytest tests/test_check_config.py tests/test_alert_rules.py tests/test_alerting.py tests/test_edge_limits.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npm test
