# Alembic configuration. Deliberately contains NO database URL or credentials:
# migrations/env.py takes the URL from the DATABASE_URL environment variable
# (online mode) or uses a credential-free placeholder (offline --sql mode).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# os: split path lists on the OS separator, so a Windows path containing ':' is not cut apart.
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Version table: alembic's default (alembic_version, default schema).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# WARN everywhere: INFO-level SQLAlchemy logging would echo SQL and parameters.
[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
