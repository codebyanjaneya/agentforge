[pytest]
testpaths = tests
pythonpath = .
# langsmith's pytest plugin (installed transitively with langchain) is unused here; keep it from auto-loading.
addopts = -ra -p no:langsmith_plugin
markers =
    postgres: needs a DISPOSABLE PostgreSQL server (AGENTFORGE_TEST_PG_ADMIN_URL / AGENTFORGE_TEST_PG_TOKEN); skipped otherwise
